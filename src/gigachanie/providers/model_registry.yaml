# GigaChanie 모델 레지스트리
#
# 각 모델의 메타데이터. `giga doctor` 가 이 목록과 감지된 하드웨어를 대조해
# 실행 가능 모델을 추천한다. 사용자는 `giga model list / use` 로 직접 선택한다.
#
# 필드 설명:
#   id             : 내부 식별자 (kebab-case)
#   display        : 사람이 읽는 이름
#   family         : 계열 (qwen, llama, deepseek, mistral, glm, google, microsoft, ...)
#   kind           : coder | general | reasoning
#   params_b       : 총 파라미터 (10억 단위)
#   active_params_b: 추론 시 활성 파라미터 (MoE가 아니면 params_b 와 동일). 속도 추정에 사용
#   context        : 권장 기본 컨텍스트 길이(토큰)
#   max_context    : 모델이 지원하는 최대 컨텍스트
#   tool_calling   : native | prompt | none
#   vision         : 멀티모달(이미지) 지원 여부
#   layers/kv_heads/head_dim : KV 캐시 크기 계산용 (transformers config 기준)
#   license        : 라이선스 식별자
#   backends       : 구동 가능한 백엔드
#   ollama_tag     : ollama 에서 pull 할 태그 (있으면)
#   quants         : 양자화별 가중치 크기(GB). weights_gb 는 파일 크기 근사치
#   notes          : 비고

schema_version: 1

defaults:
  # KV 캐시 1토큰당 바이트 = 2(K,V) * layers * kv_heads * head_dim * kv_dtype_bytes
  kv_dtype_bytes: 2          # fp16 기준. Q8 KV 캐시 사용 시 1
  runtime_overhead_gb: 1.0   # 활성화 텐서 + 프레임워크 오버헤드 여유
  min_useful_context: 8192   # 이 값 미만이면 "실행 불가"로 간주
  target_context: 16384      # 추천 시 확보하려는 컨텍스트

