[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gigachanie"
version = "0.0.1"
description = "오픈 웨이트 LLM(Qwen, Llama, DeepSeek 등)으로 동작하는 코딩 에이전트 CLI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "apg0001" }]
keywords = ["llm", "coding-agent", "cli", "qwen", "llama", "ollama"]

dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "psutil>=6.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "platformdirs>=4.2",
    "prompt-toolkit>=3.0",
]

[project.optional-dependencies]
pdf = ["pypdf>=4.0"]
docs = ["python-pptx>=0.6", "python-docx>=1.0", "markdown>=3.5"]
otel = [
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-http>=1.20",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml",
    "types-psutil",
]

[project.scripts]
giga = "gigachanie.cli:app"

[project.urls]
Repository = "https://github.com/apg0001/GigaChanie"

[tool.hatch.build.targets.wheel]
packages = ["src/gigachanie"]
include = ["src/gigachanie/**/*.py", "src/gigachanie/**/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/gigachanie/eval/tasks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# typer 의 관용적 사용: 기본 인자 자리의 Argument/Option 호출 허용
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/gigachanie"]
exclude = ["src/gigachanie/eval/tasks/"]

[[tool.mypy.overrides]]
module = ["psutil", "pypdf", "pptx", "pptx.*", "docx", "markdown", "opentelemetry.*"]
ignore_missing_imports = true
